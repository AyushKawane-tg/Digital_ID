<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        TeleGlobal Digital Card
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/base.css') }}?v={{ ASSET_V }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}

    <script
        src="{{ url_for('static', path='js/base.js') }}?v={{ ASSET_V }}"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
